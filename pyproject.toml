[project]
name = "gexis-roon"
version = "0.2.1"
description = "Roon as a Gexis Player plugin"
requires-python = ">=3.11"
# **No runtime dependencies** beyond the player's own (alsa-utils' arecord and
# aplay), as gexis-airplay: an appliance's plugin that needs a virtualenv
# breaks on an upgrade nobody watched.
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
